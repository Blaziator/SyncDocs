services:

  redis:
    image: redis:7-alpine
    container_name: syncdocs-redis

    ports:
      - "6379:6379"

  backend1:

    build:
      context: ../Backend

    container_name: syncdocs-backend1

    environment:
      PORT: 8080
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      USE_REDIS: "true"
      DISABLE_RATE_LIMIT: "false"

    ports:
      - "8080:8080"

    depends_on:
      - redis

  backend2:

    build:
      context: ../Backend

    container_name: syncdocs-backend2

    environment:
      PORT: 8080
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      USE_REDIS: "true"
      DISABLE_RATE_LIMIT: "false"

    ports:
      - "8081:8080"

    depends_on:
      - redis

  nginx:

    image: nginx:alpine

    container_name: syncdocs-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend1
      - backend2

  frontend:

    build:
      context: ../Frontend

    container_name: syncdocs-frontend

    environment:
      VITE_API_URL: ${VITE_API_URL}

    ports:
      - "5173:5173"

    depends_on:
      - nginx