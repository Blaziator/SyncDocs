      <stop offset="100%" stop-color="#484bff"/>
    </linearGradient>

    <linearGradient id="foldFill" x1="751" y1="213" x2="929" y2="449" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef0f7"/>
